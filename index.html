
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねこを落とすな！</title>
<style>
*{box-sizing:border-box}
body{margin:0;text-align:center;font-family:sans-serif;background:#dff5ff;color:#18314b}
header{background:#18314b;color:white;padding:18px;font-size:22px;font-weight:bold}
h1{font-size:clamp(36px,8vw,60px);color:#1685ff}
main{max-width:750px;margin:auto;padding:16px}
canvas{width:100%;height:auto;background:#a6e4ff;border:4px solid white;border-radius:18px;touch-action:none}
button{border:0;border-radius:14px;padding:14px 22px;margin:6px;font-size:18px;font-weight:bold;cursor:pointer;background:#1685ff;color:white}
#left,#right{background:#18314b;width:110px}
.panel{background:white;padding:18px;border-radius:18px;margin:18px 0}
</style>
</head>
<body>
<header>🐱 ゆるねこゲームズ</header>
<main>
<h1>ねこを落とすな！</h1>
<p>落ちてくるブロックをよけて、ハイスコアを目指そう！</p>
<button onclick="start()">▶ ゲームスタート</button>
<div class="panel">
<canvas id="game" width="600" height="400"></canvas>
<h2>スコア：<span id="score">0</span></h2>
<h3>自己ベスト：<span id="best">0</span></h3>
<button id="left">◀ 左</button>
<button id="right">右 ▶</button>
<p>パソコン：← → キー ／ スマホ：左右ボタン</p>
</div>
<div class="panel">
<h2>🎮 遊び方</h2>
<p>猫を左右に動かして、落ちてくるブロックを避けよう！</p>
<p>ぶつかったらゲームオーバー。何点取れるかな？</p>
<button onclick="share()">𝕏 スコアをシェア</button>
</div>
</main>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let x=300,blocks=[],score=0,best=0,playing=false,keys={},frame=0;
try{best=Number(localStorage.getItem("catBest")||0)}catch(e){}
document.getElementById("best").textContent=best;
function draw(){
 ctx.clearRect(0,0,600,400);
 ctx.fillStyle="#a6e4ff";ctx.fillRect(0,0,600,400);
 ctx.fillStyle="#fff";
 for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(i*160+50,60,20,0,7);ctx.arc(i*160+75,55,27,0,7);ctx.fill()}
 ctx.fillStyle="#18314b";
 blocks.forEach(b=>ctx.fillRect(b.x,b.y,b.s,b.s));
 ctx.fillStyle="#fff";ctx.strokeStyle="#18314b";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(x-25,300);ctx.lineTo(x-23,275);ctx.lineTo(x-8,285);ctx.lineTo(x+8,285);ctx.lineTo(x+23,275);ctx.lineTo(x+25,300);ctx.quadraticCurveTo(x+25,325,x,325);ctx.quadraticCurveTo(x-25,325,x-25,300);ctx.fill();ctx.stroke();
 ctx.fillStyle="#18314b";ctx.beginPath();ctx.arc(x-9,298,3,0,7);ctx.arc(x+9,298,3,0,7);ctx.fill();
 if(!playing){ctx.fillStyle="#18314bdd";ctx.fillRect(0,0,600,400);ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 30px sans-serif";ctx.fillText(score?"ゲームオーバー！":"スタートを押してね",300,180);ctx.font="22px sans-serif";ctx.fillText(score?"スコア："+score:"ねこを守ろう！",300,220)}
}
function loop(){
 if(!playing)return;
 frame++;score+=0.08;
 document.getElementById("score").textContent=Math.floor(score);
 if(keys.ArrowLeft||keys.a)x-=6;
 if(keys.ArrowRight||keys.d)x+=6;
 x=Math.max(25,Math.min(575,x));
 if(frame%38===0)blocks.push({x:Math.random()*560,y:-25,s:20+Math.random()*18});
 blocks.forEach(b=>b.y+=3+score/200);
 for(const b of blocks){
 if(x+20>b.x&&x-20<b.x+b.s&&310>b.y&&285<b.y+b.s){
 playing=false;best=Math.max(best,Math.floor(score));
 document.getElementById("best").textContent=best;
 try{localStorage.setItem("catBest",best)}catch(e){}
 draw();return;
 }}
 blocks=blocks.filter(b=>b.y<420);
 draw();requestAnimationFrame(loop);
}
function start(){x=300;blocks=[];score=0;frame=0;playing=true;draw();loop()}
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);
function hold(id,key){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}
hold("left","ArrowLeft");hold("right","ArrowRight");
function share(){
 const msg="ねこを落とすな！で"+best+"点を記録！君は超えられる？";
 window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(msg+" "+location.href),"_blank");
}
draw();
</script>
</body>
</html>
